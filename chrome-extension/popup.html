<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>LC Template Generator</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 500px;
      min-height: 200px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      padding: 16px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #333;
    }

    .header h1 {
      font-size: 16px;
      color: #ffa116;
      font-weight: 600;
    }

    .header .logo {
      font-size: 22px;
    }

    /* Status messages */
    .status {
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 12px;
      display: none;
    }

    .status.error {
      background: #2d1b1b;
      color: #ff6b6b;
      border: 1px solid #4a2020;
      display: block;
    }

    .status.success {
      background: #1b2d1b;
      color: #6bff6b;
      border: 1px solid #204a20;
      display: block;
    }

    .status.loading {
      background: #1b1b2d;
      color: #6b6bff;
      border: 1px solid #20204a;
      display: block;
    }

    /* Buttons */
    .btn-row {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .btn {
      padding: 10px 18px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      flex: 1;
    }

    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn-primary {
      background: #ffa116;
      color: #1a1a2e;
    }

    .btn-primary:hover {
      background: #ffb340;
    }

    .btn-primary:disabled {
      background: #665a3a;
      color: #999;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .btn-secondary {
      background: #2d2d44;
      color: #e0e0e0;
      border: 1px solid #444;
    }

    .btn-secondary:hover {
      background: #3d3d55;
    }

    /* Code output */
    .code-container {
      display: none;
      margin-top: 12px;
    }

    .code-container.visible {
      display: block;
    }

    .code-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .code-header span {
      font-size: 12px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .copy-btn {
      padding: 4px 12px;
      font-size: 11px;
      background: #2d2d44;
      color: #aaa;
      border: 1px solid #444;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .copy-btn:hover {
      background: #3d3d55;
      color: #fff;
    }

    .copy-btn.copied {
      background: #1b4a20;
      color: #6bff6b;
      border-color: #2d6a30;
    }

    pre {
      background: #0d1117;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 14px;
      overflow-x: auto;
      max-height: 400px;
      overflow-y: auto;
    }

    pre code {
      font-family: 'Fira Code', 'Consolas', 'Monaco', monospace;
      font-size: 12px;
      line-height: 1.5;
      color: #c9d1d9;
      white-space: pre;
    }

    /* Paste mode */
    .paste-section {
      display: none;
      margin-bottom: 12px;
    }

    .paste-section.visible {
      display: block;
    }

    .paste-section textarea {
      width: 100%;
      height: 120px;
      background: #0d1117;
      color: #c9d1d9;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 10px;
      font-family: 'Fira Code', 'Consolas', monospace;
      font-size: 12px;
      resize: vertical;
      margin-bottom: 8px;
    }

    .paste-section textarea:focus {
      outline: none;
      border-color: #ffa116;
    }

    .not-on-lc {
      text-align: center;
      padding: 20px 0;
      color: #888;
      font-size: 13px;
    }

    .not-on-lc .paste-hint {
      margin-top: 12px;
      font-size: 12px;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="logo">⚡</span>
    <h1>LC Template Generator</h1>
  </div>

  <div id="status" class="status"></div>

  <!-- Main buttons (shown on LC pages) -->
  <div class="btn-row" id="btnRow">
    <button class="btn btn-primary" id="generateBtn">🚀 Generate Template</button>
    <button class="btn btn-secondary" id="pasteBtn">📋 Paste Code</button>
  </div>

  <!-- Paste section (manual input) -->
  <div class="paste-section" id="pasteSection">
    <textarea id="pasteArea" placeholder="Paste your LeetCode C++ template here...&#10;&#10;class Solution {&#10;public:&#10;    bool isPalindrome(int x) {&#10;        &#10;    }&#10;};"></textarea>
    <button class="btn btn-primary" id="generatePasteBtn" style="width: 100%">🚀 Generate from Paste</button>
  </div>

  <!-- Generated code output -->
  <div class="code-container" id="codeContainer">
    <div class="code-header">
      <span>Generated Code</span>
      <button class="copy-btn" id="copyBtn">📋 Copy</button>
    </div>
    <pre><code id="codeOutput"></code></pre>
  </div>

  <script src="popup.js"></script>
</body>
</html>
